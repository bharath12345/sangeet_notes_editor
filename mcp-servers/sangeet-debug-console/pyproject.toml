[project]
name = "sangeet-debug-console"
version = "0.2.0"
description = "MCP server wrapping the Sangeet Notes Editor debug bridge (TCP for desktop, WebSocket for web)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-asyncio>=0.23", "hypothesis>=6.0"]

[project.scripts]
sangeet-debug-console = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "transport.py",
    "transport_tcp.py",
    "transport_ws.py",
]
sources = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
