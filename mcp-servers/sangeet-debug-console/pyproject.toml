[project]
name = "sangeet-debug-console"
version = "0.1.0"
description = "MCP server wrapping the Sangeet Notes Editor TCP debug console (127.0.0.1:28081)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
sangeet-debug-console = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]
