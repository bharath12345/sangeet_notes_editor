      summary: Liveness probe
      description: Returns 200 with service identification once the server is bound.
      operationId: health
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      summary: Prometheus scrape endpoint
      description: Returns process + HTTP metrics in Prometheus text exposition format
