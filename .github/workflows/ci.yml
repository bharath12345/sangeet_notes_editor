name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  # Phase 10: keep CI / packaging runs out of the desktop PostHog dashboard.
  # PostHogClient.fromEnv honors this and returns NoopPostHogClient regardless
  # of whether SANGEET_POSTHOG_API_KEY is set, so test runs don't pollute the
  # production analytics stream even if we later bake a build-time key.
  SANGEET_ANALYTICS_DISABLED: '1'

jobs:
  # Detect which areas of the repo changed in this push/PR. Downstream jobs key
  # off these flags so docs-only or single-stack changes don't pay for the full
  # pipeline. Was ~8 min wall-clock for every change; can drop to ~2 min for a
  # docs-only edit.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      scala: ${{ steps.filter.outputs.scala }}
      desktop: ${{ steps.filter.outputs.desktop }}
      elm: ${{ steps.filter.outputs.elm }}
      e2e: ${{ steps.filter.outputs.e2e }}
      scripts: ${{ steps.filter.outputs.scripts }}
      mcp: ${{ steps.filter.outputs.mcp }}
      always: ${{ steps.filter.outputs.always }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scala:
              - 'sangeet-core/**'
              - 'sangeet-server/**'
              - 'sangeet-desktop/**'
              - 'build.sbt'
              - 'project/**'
              - '.scalafmt.conf'
              - '.scalafix.conf'
            # `desktop` triggers the (slow, xvfb-bound) JavaFX integration job.
            # Keep it narrow — core changes don't need to repay this cost
            # unless they touch the desktop module or shared editor logic.
            desktop:
              - 'sangeet-desktop/**'
              - 'sangeet-core/src/main/**'
              - 'tests/integration/**'
              - 'build.sbt'
              - 'project/**'
            elm:
              - 'sangeet-web/src/**'
              - 'sangeet-web/tests/**'
              - 'sangeet-web/elm.json'
              - 'sangeet-web/package*.json'
              - 'sangeet-web/review/**'
            e2e:
              # Anything that affects what the e2e tests can observe:
              # the frontend, the backend's API surface, the tests
              # themselves, or build/runtime config. Internal-only
              # server modules (e.g. metrics/) are intentionally excluded.
              - 'sangeet-web/**'
              - 'sangeet-server/src/main/scala/com/varpas/sangeet/server/endpoints/**'
              - 'sangeet-server/src/main/scala/com/varpas/sangeet/server/routes/**'
              - 'sangeet-server/src/main/scala/com/varpas/sangeet/server/Main.scala'
              - 'sangeet-server/src/main/scala/com/varpas/sangeet/server/CorsMiddleware.scala'
              - 'sangeet-server/src/main/scala/com/varpas/sangeet/server/ApiEnvelope.scala'
              - 'sangeet-server/src/main/scala/com/varpas/sangeet/server/ErrorMapping.scala'
              - 'sangeet-core/src/main/**'
              - 'e2e/**'
              - 'build.sbt'
              - 'project/**'
            # `scripts` covers the vitest tests under scripts/__tests__.
            # The catalog JSON is on the trigger list because regen jobs key
            # off it; if it lives somewhere else later, update both lists.
            scripts:
              - 'scripts/**'
              - 'sangeet-core/src/main/resources/ui-strings.json'
            # `mcp` covers the pytest suite for the MCP debug-console server.
            mcp:
              - 'mcp-servers/**'
            always:
              # When CI itself changes, run the whole pipeline so the
              # new workflow gets validated against every job.
              - '.github/workflows/ci.yml'

  # Lint is fast (~2 min) and catches issues across all languages — always run.
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same Elm package cache as the elm-tests job — elm-review compiles the
      # Elm source so it also fetches packages.
      - name: Cache Elm packages
        uses: actions/cache@v5
        with:
          path: |
            sangeet-web/elm-stuff
            ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('sangeet-web/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Install Elm dependencies
        run: cd sangeet-web && npm ci

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Check Scala formatting
        run: sbt scalafmtCheckAll

      - name: Check Scala linting
        run: sbt "scalafixAll --check"

      - name: Check Elm formatting
        run: cd sangeet-web && ./node_modules/.bin/elm-format src/ tests/ --validate

      - name: Check Elm linting
        run: cd sangeet-web && ./node_modules/.bin/elm-review

      - name: Check Prettier formatting
        run: npx prettier --check e2e/ sangeet-web/public/ports.js sangeet-web/public/styles.css

      - name: Check TypeScript linting
        run: cd e2e && ./node_modules/.bin/eslint .

  scala-tests:
    name: Scala Tests + Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scala == 'true' || needs.changes.outputs.always == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests with coverage
        run: sbt coverage sangeetCore/test sangeetServer/test coverageReport coverageAggregate

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoverage-report
          path: target/scala-*/scoverage-report/
          retention-days: 14

  # Desktop tests need JavaFX, which needs an X server. We run them under
  # xvfb-run on the standard Ubuntu runner — JavaFX comes from the JDK bundle
  # so the only extra apt install is xvfb plus the X11/font libs the FX
  # renderer dlopens at startup. SBT_OPTS bumps the heap because JavaFX +
  # the integration suite hold more state than the core/server jobs.
  desktop-tests:
    name: Desktop Tests (JavaFX)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.always == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install xvfb + JavaFX native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libfreetype6 \
            libgtk-3-0 \
            libasound2t64

      - name: Run desktop tests under Xvfb
        env:
          SBT_OPTS: '-Xmx2G'
        run: xvfb-run -a sbt sangeetDesktop/test

  elm-tests:
    name: Elm Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.elm == 'true' || needs.changes.outputs.always == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache compiled Elm packages so transient 502s from
      # package.elm-lang.org / github.com/elm/* don't break CI on commits
      # that didn't change deps. elm-stuff + ~/.elm hold the package store
      # and per-project build cache.
      - name: Cache Elm packages
        uses: actions/cache@v5
        with:
          path: |
            sangeet-web/elm-stuff
            ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('sangeet-web/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Install Elm dependencies
        run: cd sangeet-web && npm ci

      - name: Run Elm tests
        run: cd sangeet-web && npx elm-test

  # vitest suite for the strings-catalog tooling under scripts/__tests__.
  # Gated on the `scripts` filter so unrelated changes don't pay for it.
  scripts-tests:
    name: Scripts Tests (vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.always == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install scripts dependencies
        run: cd scripts && npm ci

      - name: Run vitest
        # `npm test` in scripts/ already passes `--run` to vitest via the
        # package script (no watch mode in CI). If the package script ever
        # changes, update this command.
        run: cd scripts && npm test

  # pytest suite for the MCP debug-console (WS transport + text->JSON parser).
  # Lives in mcp-servers/sangeet-debug-console/. Gated on the `mcp` filter.
  mcp-pytest:
    name: MCP Pytest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.always == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # pyproject.toml declares requires-python = ">=3.10"; 3.11 is the
          # lowest LTS available on hosted runners that also satisfies the
          # mcp[cli] / websockets transitive constraints.
          python-version: '3.11'

      - name: Install package + test extras
        run: |
          cd mcp-servers/sangeet-debug-console
          pip install -e ".[test]"

      - name: Run pytest
        run: |
          cd mcp-servers/sangeet-debug-console
          pytest

  # Always-on (no path filter): catches drift between the ui-strings.json
  # catalog and the Scala / Elm sites that consume it.
  string-parity:
    name: UI strings parity check
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install scripts dependencies
        run: cd scripts && npm ci

      - name: Run parity check
        run: make check-strings

  strings-gen-sync:
    name: UiStrings generated files in sync
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Regenerate UiStrings
        run: make gen-strings

      - name: Assert no diff
        run: |
          git diff --exit-code -- \
            sangeet-core/src/main/scala/com/varpas/sangeet/core/strings/UiStrings.scala \
            sangeet-web/src/UiStrings.elm

  e2e-tests:
    name: E2E Browser Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [changes, lint, scala-tests, elm-tests]
    # A skipped need is treated as success by default, so e2e still runs
    # even when scala-tests / elm-tests are skipped by their own filters.
    if: |
      (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.always == 'true')
      && !cancelled()
      && needs.lint.result == 'success'
      && (needs.scala-tests.result == 'success' || needs.scala-tests.result == 'skipped')
      && (needs.elm-tests.result == 'success' || needs.elm-tests.result == 'skipped')
    # Playwright's native --shard=N/4 splits the 126 specs deterministically
    # across 4 parallel runners. Each runner boots its own sbt server +
    # browser — independent state, no contention. Wall-clock drops from
    # ~5m20s to ~2m. fail-fast off so we see all shards' failures, not just
    # the first one to die.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same Elm package cache as the other elm-touching jobs — the
      # `elm make --optimize` step below will fetch packages otherwise.
      - name: Cache Elm packages
        uses: actions/cache@v5
        with:
          path: |
            sangeet-web/elm-stuff
            ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('sangeet-web/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Build Elm frontend
        run: cd sangeet-web && npm ci && npx elm make src/Main.elm --optimize --output=public/elm.js

      - name: Install e2e npm dependencies
        run: cd e2e && npm ci

      # Cache the Playwright browser binaries (~120MB) between runs. Keyed on
      # the e2e lockfile so a Playwright version bump invalidates the cache
      # automatically. Saves ~10s per shard, 40s total across the 4-shard fan-out.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd e2e && ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install Playwright system deps (on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd e2e && ./node_modules/.bin/playwright install-deps chromium

      - name: Start backend server
        run: sbt "sangeetServer/run" &
        env:
          SBT_OPTS: '-Xmx1g'

      - name: Wait for backend server
        run: |
          echo "Waiting for backend on :28080..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:28080/api/v1/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: cd e2e && ./node_modules/.bin/playwright test --shard=${{ matrix.shard }}/4

      # Each shard uploads its own report; artifact name must be unique per
      # matrix value or upload-artifact@v7 collides. Only upload on failure —
      # Playwright's HTML reporter only writes the directory when there are
      # failures to report, so green runs would otherwise log a noisy
      # "No files were found" warning.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 30

  # Single aggregate check that branch protection can require. Without this,
  # any docs-only or backend-internal PR (where path filters skip elm-tests /
  # e2e-tests / scala-tests) would be blocked because branch protection treats
  # a skipped check as "missing" rather than green. The gate accepts `skipped`
  # as a pass for conditional jobs and only fails if a job actually failed or
  # was cancelled. Make this — and only this — the required check.
  merge-gate:
    name: CI Merge Gate
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        lint,
        scala-tests,
        desktop-tests,
        elm-tests,
        e2e-tests,
        scripts-tests,
        mcp-pytest,
        string-parity,
        strings-gen-sync,
      ]
    if: always() && !cancelled()
    steps:
      - name: Aggregate job results
        run: |
          echo "changes:          ${{ needs.changes.result }}"
          echo "lint:             ${{ needs.lint.result }}"
          echo "scala-tests:      ${{ needs.scala-tests.result }}"
          echo "desktop-tests:    ${{ needs.desktop-tests.result }}"
          echo "elm-tests:        ${{ needs.elm-tests.result }}"
          echo "e2e-tests:        ${{ needs.e2e-tests.result }}"
          echo "scripts-tests:    ${{ needs.scripts-tests.result }}"
          echo "mcp-pytest:       ${{ needs.mcp-pytest.result }}"
          echo "string-parity:    ${{ needs.string-parity.result }}"
          echo "strings-gen-sync: ${{ needs.strings-gen-sync.result }}"

          fail=0
          # `changes`, `lint`, `string-parity`, `strings-gen-sync` have no if-filter — always run and must succeed.
          for required_pass in "changes ${{ needs.changes.result }}" "lint ${{ needs.lint.result }}" "string-parity ${{ needs.string-parity.result }}" "strings-gen-sync ${{ needs.strings-gen-sync.result }}"; do
            name=$(echo "$required_pass" | awk '{print $1}')
            result=$(echo "$required_pass" | awk '{print $2}')
            if [ "$result" != "success" ]; then
              echo "::error::$name must succeed (got: $result)"; fail=1
            fi
          done
          # Conditional jobs: `success` or `skipped` both count as a pass.
          for conditional in \
            "scala-tests ${{ needs.scala-tests.result }}" \
            "desktop-tests ${{ needs.desktop-tests.result }}" \
            "elm-tests ${{ needs.elm-tests.result }}" \
            "e2e-tests ${{ needs.e2e-tests.result }}" \
            "scripts-tests ${{ needs.scripts-tests.result }}" \
            "mcp-pytest ${{ needs.mcp-pytest.result }}"; do
            name=$(echo "$conditional" | awk '{print $1}')
            result=$(echo "$conditional" | awk '{print $2}')
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name ended in $result"; fail=1 ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo "Merge gate FAILED."
            exit 1
          fi
          echo "All CI jobs satisfied the merge gate."
