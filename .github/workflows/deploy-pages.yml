# Build the Elm web app + snapshot per-module repo metrics, publish both to
# GitHub Pages on every push to main.
#
# Site layout served:
#   /          → Elm app (from sangeet-web/public/)
#   /metrics/  → growth dashboard (from scripts/dashboard/ + accumulated history.json)
#
# See docs/hosting-gcp.md for the matching backend (Cloud Run) deploy steps.
# See docs/developer/metrics-dashboard.md for how the metrics half works.
#
# Repo settings → Pages → Source must be "GitHub Actions" for this to publish.
# The Elm site URL will be https://<user>.github.io/<repo>/.
#
# Triggers on every push to main (not just sangeet-web changes) so we always
# capture a fresh growth snapshot. The auto-commit of history.json uses
# GITHUB_TOKEN, which by design does NOT re-trigger this workflow — no loop.

name: Deploy Frontend + Metrics (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Pages can only have one active deployment at a time. Cancel any in-flight
# build when a newer commit arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so the auto-commit can fast-forward push.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sangeet-web/package-lock.json

      - name: Install npm dependencies
        working-directory: sangeet-web
        run: npm ci

      - name: Build Elm (optimize)
        working-directory: sangeet-web
        run: ./node_modules/.bin/elm make src/Main.elm --optimize --output=public/elm.js

      - name: Install scc
        run: |
          SCC_VERSION=3.7.0
          curl -sSL -o /tmp/scc.tar.gz \
            "https://github.com/boyter/scc/releases/download/v${SCC_VERSION}/scc_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/scc.tar.gz -C /usr/local/bin scc
          scc --version

      - name: Snapshot metrics
        run: |
          mkdir -p scripts/dashboard
          ./scripts/collect_metrics.py > /tmp/snapshot.json
          ./scripts/append_snapshot.py scripts/dashboard/history.json /tmp/snapshot.json

      - name: Commit history.json back to main
        run: |
          if git diff --quiet scripts/dashboard/history.json; then
            echo "history.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/dashboard/history.json
          git commit -m "chore(metrics): snapshot for ${GITHUB_SHA::8} [skip ci]"
          # Rebase onto any concurrent commits before pushing. GITHUB_TOKEN
          # pushes don't trigger workflows, so this won't loop.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stage Pages bundle
        run: |
          # Elm app lives at site root; metrics dashboard at /metrics/.
          mkdir -p sangeet-web/public/metrics
          cp scripts/dashboard/index.html scripts/dashboard/styles.css \
             scripts/dashboard/metrics.js scripts/dashboard/history.json \
             sangeet-web/public/metrics/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sangeet-web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
