# Build the Elm web app + snapshot per-module repo metrics, publish both to
# GitHub Pages on every push to main.
#
# Site layout served:
#   /          → Elm app (from sangeet-web/public/)
#   /metrics/  → growth dashboard (dashboard assets from main, history.json from metrics-data branch)
#
# See docs/developer/operations/hosting-gcp.md for the matching backend (Cloud Run) deploy steps.
# See docs/developer/operations/metrics-dashboard.md for how the metrics half works.
#
# Repo settings → Pages → Source must be "GitHub Actions" for this to publish.
# The Elm site URL will be https://<user>.github.io/<repo>/.
#
# history.json lives on the unprotected `metrics-data` orphan branch — the
# workflow pushes there because branch protection blocks GITHUB_TOKEN pushes
# to main. The branch is created on first run if it doesn't exist.

name: Deploy Frontend + Metrics (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Pages can only have one active deployment at a time. Cancel any in-flight
# build when a newer commit arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sangeet-web/package-lock.json

      - name: Install npm dependencies
        working-directory: sangeet-web
        run: npm ci

      - name: Build Elm (optimize)
        working-directory: sangeet-web
        run: ./node_modules/.bin/elm make src/Main.elm --optimize --output=public/elm.js

      - name: Install scc
        run: |
          SCC_VERSION=3.7.0
          curl -sSL -o /tmp/scc.tar.gz \
            "https://github.com/boyter/scc/releases/download/v${SCC_VERSION}/scc_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/scc.tar.gz -C /usr/local/bin scc
          scc --version

      - name: Snapshot metrics
        run: ./scripts/collect_metrics.py > /tmp/snapshot.json

      - name: Sync metrics-data branch + append snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DATA_DIR=/tmp/metrics-data

          # Clone the metrics-data branch if it exists; otherwise bootstrap
          # an orphan branch with an empty history.json.
          if git ls-remote --exit-code --heads "$REMOTE" metrics-data > /dev/null; then
            git clone --branch metrics-data --depth 1 "$REMOTE" "$DATA_DIR"
          else
            echo "Bootstrapping metrics-data orphan branch"
            git clone "$REMOTE" "$DATA_DIR"
            cd "$DATA_DIR"
            git checkout --orphan metrics-data
            git rm -rf . > /dev/null 2>&1 || true
            cat > README.md <<EOF
          # metrics-data

          Append-only branch holding \`history.json\` for the growth dashboard.
          Updated by .github/workflows/deploy-pages.yml on every push to \`main\`.
          Do not edit by hand — changes will be overwritten on the next workflow run.

          Served at https://${GITHUB_REPOSITORY_OWNER}.github.io/sangeet_notes_editor/metrics/.
          EOF
            echo '{"schema": 1, "snapshots": []}' > history.json
            git add README.md history.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "metrics: bootstrap empty history"
            git push origin metrics-data
            cd -
          fi

          ./scripts/append_snapshot.py "$DATA_DIR/history.json" /tmp/snapshot.json

          cd "$DATA_DIR"
          if git diff --quiet history.json; then
            echo "history.json unchanged — nothing to push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "metrics: snapshot for ${GITHUB_SHA::8}"
            git push origin metrics-data
          fi

      - name: Stage Pages bundle
        run: |
          # Elm app lives at site root; metrics dashboard at /metrics/.
          # Dashboard assets ship from main (scripts/dashboard/); history.json
          # comes from the metrics-data branch checkout we just updated.
          mkdir -p sangeet-web/public/metrics
          cp scripts/dashboard/index.html scripts/dashboard/styles.css \
             scripts/dashboard/metrics.js \
             sangeet-web/public/metrics/
          cp /tmp/metrics-data/history.json sangeet-web/public/metrics/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: sangeet-web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
