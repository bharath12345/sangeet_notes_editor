# Build the Elm web app and publish sangeet-web/public/ to GitHub Pages.
# See docs/hosting-gcp.md for the matching backend (Cloud Run) deploy steps.
#
# Repo settings → Pages → Source must be set to "GitHub Actions" for this to
# publish. The site URL will be https://<user>.github.io/<repo>/.

name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "sangeet-web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages can only have one active deployment at a time. Cancel any in-flight
# build when a newer commit arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sangeet-web/package-lock.json

      - name: Install npm dependencies
        working-directory: sangeet-web
        run: npm ci

      - name: Build Elm (optimize)
        working-directory: sangeet-web
        run: ./node_modules/.bin/elm make src/Main.elm --optimize --output=public/elm.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sangeet-web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
