# Build the sangeet-server fat JAR, push as a container image to Artifact
# Registry, and deploy a new Cloud Run revision.
#
# Auth: GitHub secret GCP_SA_KEY = JSON key for the `github-deployer` service
# account in the sangeet-editor project. See docs/hosting-gcp.md Phase 9 for
# the SA setup and role grants.

name: Deploy Backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "sangeet-server/**"
      - "sangeet-core/**"
      - "build.sbt"
      - "project/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Serialize deploys per ref; don't cancel a mid-flight one (Cloud Run might
# already be flipping traffic to the new revision).
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: sangeet-editor
  GCP_REGION: asia-south1
  AR_PATH: asia-south1-docker.pkg.dev/sangeet-editor/sangeet/server
  CLOUD_RUN_SERVICE: sangeet-server

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build server assembly JAR
        run: sbt sangeetServer/assembly

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # The repo's .gitignore excludes target/ and *.jar, so `gcloud builds
      # submit` from the repo root would auto-derive a .gcloudignore that
      # strips the assembly JAR from the upload. Stage a minimal context with
      # just the Dockerfile and the JAR.
      - name: Stage build context
        run: |
          mkdir -p /tmp/sangeet-build/sangeet-server/target/scala-3.4.2
          cp Dockerfile /tmp/sangeet-build/
          cp sangeet-server/target/scala-3.*/sangeet-server-assembly-*.jar \
             /tmp/sangeet-build/sangeet-server/target/scala-3.4.2/

      - name: Build and push image
        run: |
          gcloud builds submit /tmp/sangeet-build \
            --tag "$AR_PATH:${{ github.sha }}" \
            --region "$GCP_REGION"

      # `gcloud builds submit --tag` only accepts one tag. Add the floating
      # `:latest` pointer as a separate metadata-only op so manual/dockerless
      # workflows can still pull `:latest`.
      - name: Tag image as :latest
        run: |
          gcloud artifacts docker tags add \
            "$AR_PATH:${{ github.sha }}" \
            "$AR_PATH:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$AR_PATH:${{ github.sha }}" \
            --region "$GCP_REGION" \
            --quiet

      - name: Smoke-test the deploy
        run: |
          URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
                  --region "$GCP_REGION" \
                  --format='value(status.url)')
          echo "Deployed to $URL"
          # Give the new revision a beat to take traffic
          sleep 5
          for path in /health /docs/ /api/v1/raags ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "Smoke test failed at $path"
              exit 1
            fi
          done
