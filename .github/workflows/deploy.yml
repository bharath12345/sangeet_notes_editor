# Deploy the web app + server to GCP (Cloud Run + Firebase Hosting).
# Triggered on push to main after CI passes. See docs/hosting-gcp.md for setup.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: sangeet-editor
  GCP_REGION: asia-south1
  IMAGE_NAME: gcr.io/sangeet-editor/server
  CLOUD_RUN_SERVICE: sangeet-server

jobs:
  deploy:
    # Run only when CI succeeded, or on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sangeet-web/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ---- Backend: build JAR, build & push image, deploy to Cloud Run ----

      - name: Build server assembly JAR
        run: sbt sangeetServer/assembly

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $CLOUD_RUN_SERVICE \
            --image $IMAGE_NAME:${{ github.sha }} \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --port 28080 \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --quiet

      # ---- Frontend: build Elm, deploy to Firebase Hosting ----

      - name: Install Elm dev tooling
        working-directory: sangeet-web
        run: npm ci

      - name: Build Elm (optimize)
        working-directory: sangeet-web
        run: ./node_modules/.bin/elm make src/Main.elm --optimize --output=public/elm.js

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v13.20.0
        with:
          args: deploy --only hosting --project ${{ env.GCP_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
