name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  ELM_VERSION: "0.19.1"

jobs:
  scala-tests:
    name: Scala Tests (core + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run core tests
        run: sbt sangeetCore/test

      - name: Run server tests
        run: sbt sangeetServer/test

  elm-tests:
    name: Elm Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Elm test dependencies
        run: cd sangeet-web && npm ci

      - name: Run Elm tests
        run: cd sangeet-web && npx elm-test

  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [scala-tests, elm-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Elm frontend
        run: cd sangeet-web && npm ci && npx elm make src/Main.elm --optimize --output=public/elm.js

      - name: Install Playwright dependencies
        run: cd e2e && npm ci && ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start backend server
        run: sbt "sangeetServer/run" &
        env:
          SBT_OPTS: "-Xmx1g"

      - name: Wait for backend server
        run: |
          echo "Waiting for backend on :28080..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:28080/api/v1/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        run: cd e2e && ./node_modules/.bin/playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
