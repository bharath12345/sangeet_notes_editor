# Monthly Elm dependency check.
#
# Renovate has no native Elm manager (verified against the upstream
# managers list), so sangeet-web/elm.json is outside the Renovate
# pipeline. This workflow fills that gap: once a month it runs
# `elm-json install` against each direct Elm dependency to pull
# whatever version is current, runs the Elm test suite against the
# new versions, and opens a PR. The PR body says whether elm-test
# passed, so reviewing is just "scan the diff + glance at the test
# status badge".
#
# Schedule: 03:13 UTC on the 1st of every month (= 08:43 IST), with
# the off-minute to avoid the GitHub cron stampede. Also runnable
# on-demand via workflow_dispatch.
#
# If no dependency changed, the workflow exits early without opening
# a PR — no noise on stable months.

name: Elm Dependencies (Monthly)

on:
  schedule:
    - cron: '13 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-elm-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sangeet-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sangeet-web/package-lock.json

      - name: Install npm devDependencies (elm, elm-test)
        run: npm ci

      - name: Snapshot baseline elm.json
        run: cp elm.json /tmp/elm.json.before

      - name: Upgrade each direct dependency to latest
        run: |
          set -e
          for pkg in $(jq -r '.dependencies.direct | keys[]' elm.json); do
            echo "::group::Upgrading $pkg"
            # `elm-json install` (no version) picks up the latest version
            # that resolves against the current constraints.
            npx --yes elm-json install --yes "$pkg" -- elm.json || true
            echo "::endgroup::"
          done

      - name: Diff vs baseline
        id: diff
        run: |
          if diff -q /tmp/elm.json.before elm.json > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            diff -u /tmp/elm.json.before elm.json > /tmp/elm.diff || true
            echo "--- diff ---"
            cat /tmp/elm.diff
          fi

      - name: Run elm-test against the upgraded deps
        id: test
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npx elm-test

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          MONTH="$(date -u +%Y-%m)"
          BRANCH="elm-deps/monthly-${MONTH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If the branch already exists from a prior re-run this month,
          # delete it locally and force-push to keep the PR fresh.
          git checkout -B "$BRANCH"
          git add sangeet-web/elm.json
          git commit -m "chore(deps): monthly Elm dependency update ($MONTH)"
          git push --force-with-lease origin "$BRANCH"

          if [ "${{ steps.test.outcome }}" = "success" ]; then
            STATUS="✅ Passing — safe to squash-merge"
          else
            STATUS="❌ Failing — review breakage before merging"
          fi

          # Use --fill semantics manually; we want a custom body.
          if gh pr view "$BRANCH" --json number > /dev/null 2>&1; then
            echo "PR already exists for $BRANCH; updating body."
            PR_NUM=$(gh pr view "$BRANCH" --json number --jq .number)
            gh pr edit "$PR_NUM" --body "$(cat <<EOF
          ## Monthly Elm dependency check ($MONTH)

          Auto-generated by [\`.github/workflows/elm-deps-monthly.yml\`](.github/workflows/elm-deps-monthly.yml).

          ### elm-test status

          $STATUS

          ### elm.json diff

          \`\`\`diff
          $(cat /tmp/elm.diff)
          \`\`\`

          If elm-test passes, this PR is safe to squash-merge. If it fails, click through to the Actions log linked above and decide whether to roll forward or close the PR.
          EOF
          )"
          else
            gh pr create \
              --title "chore(deps): monthly Elm dependency update ($MONTH)" \
              --label dependencies \
              --body "$(cat <<EOF
          ## Monthly Elm dependency check ($MONTH)

          Auto-generated by [\`.github/workflows/elm-deps-monthly.yml\`](.github/workflows/elm-deps-monthly.yml).

          ### elm-test status

          $STATUS

          ### elm.json diff

          \`\`\`diff
          $(cat /tmp/elm.diff)
          \`\`\`

          If elm-test passes, this PR is safe to squash-merge. If it fails, click through to the Actions log linked above and decide whether to roll forward or close the PR.
          EOF
          )"
          fi
