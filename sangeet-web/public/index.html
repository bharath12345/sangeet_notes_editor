  <body>
    <div id="elm-app"></div>
    <script src="elm.js"></script>
    <script src="ports.js"></script>
    <script>
      // Auto-pick API URL by hostname so the same bundle works in dev and prod.
      function getApiBaseUrl() {
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '') {
          return 'http://localhost:28080/api/v1';
        }
        return 'https://sangeet-server-729103223940.asia-south1.run.app/api/v1';
      }
      var debugUrl = new URLSearchParams(window.location.search).get('debug') || null;

      // Resolve initial theme BEFORE mount so the first paint already uses
      // the right palette (no Light → Dark flash). Priority:
      //   1. localStorage["sangeet:theme"]  — user's last explicit choice
      //   2. prefers-color-scheme: dark     — OS-level preference
      //   3. Light                          — final fallback
      // Apply the resolved value to <body data-theme> right here so the
      // CSS custom-property overrides activate before Elm renders.
      function resolveInitialTheme() {
        try {
          var saved = localStorage.getItem('sangeet:theme');
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (_e) {
          // localStorage can throw in private-browsing modes — degrade
          // gracefully to the media-query path.
        }
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
        return 'light';
      }
      var initialTheme = resolveInitialTheme();
      document.body.dataset.theme = initialTheme;

      var app = Elm.Main.init({
        node: document.getElementById('elm-app'),
        flags: {
          apiBaseUrl: getApiBaseUrl(),
          debugUrl: debugUrl,
          initialTheme: initialTheme,
        },
      });
      initPorts(app);
    </script>
