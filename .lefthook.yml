pre-commit:
  parallel: true
  commands:
    gen-strings-if-catalog-changed:
      glob: 'sangeet-core/src/main/resources/ui-strings.json'
      run: |
        make gen-strings
        git add sangeet-core/src/main/scala/com/varpas/sangeet/core/strings/UiStrings.scala
        git add sangeet-web/src/UiStrings.elm
    scalafmt:
      glob: "*.scala"
      run: sbt --batch scalafmtCheckAll 2>&1
    elm-format:
      glob: "*.elm"
      run: cd sangeet-web && ./node_modules/.bin/elm-format src/ tests/ --validate
    prettier:
      glob: "*.{js,ts,json,css,md}"
      run: ./node_modules/.bin/prettier --check e2e/ sangeet-web/public/ports.js sangeet-web/public/styles.css
